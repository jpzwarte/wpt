<!doctype html>
<meta charset="utf-8" />
<title>:has-slotted in the selector APIs without a preceding style or slot-assignment flush</title>
<link rel="help" href="https://drafts.csswg.org/css-shadow-1/#the-has-slotted-pseudo" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<!--
  Selector matching must reflect the current slot assignments on its own. These
  tests deliberately call matches()/querySelectorAll() as the very first thing
  that touches each host, without calling assignedNodes() or getComputedStyle()
  first, since those can force an implementation's lazily computed slot
  assignments to be recalculated and would hide a missing flush.
  Each test uses its own host for the same reason.
-->
<div id="host1"><template shadowrootmode="open"><slot></slot></template><i>light</i></div>
<div id="host2"><template shadowrootmode="open"><slot></slot></template><i>light</i></div>
<div id="host3"><template shadowrootmode="open"><slot></slot></template></div>
<div id="host4"><template shadowrootmode="open"><slot></slot></template><i>light</i></div>
<div id="host5"><template shadowrootmode="open"><slot name="named"></slot></template><i slot="named">light</i></div>
<script>
  test(function () {
    const slot = document.getElementById("host1").shadowRoot.querySelector("slot");
    assert_true(slot.matches(":has-slotted"));
  }, "matches() reflects parser-time slot assignment without a preceding flush");

  test(function () {
    const shadowRoot = document.getElementById("host2").shadowRoot;
    assert_equals(shadowRoot.querySelectorAll(":has-slotted").length, 1);
  }, "querySelectorAll() reflects parser-time slot assignment without a preceding flush");

  test(function () {
    const host = document.getElementById("host3");
    const slot = host.shadowRoot.querySelector("slot");
    host.append(document.createElement("i"));
    assert_true(slot.matches(":has-slotted"),
                "matches() reflects the appended child");
    assert_equals(host.shadowRoot.querySelectorAll(":has-slotted").length, 1,
                  "querySelectorAll() reflects the appended child");
  }, "The selector APIs reflect an appended child without a preceding flush");

  test(function () {
    const host = document.getElementById("host4");
    const slot = host.shadowRoot.querySelector("slot");
    host.replaceChildren();
    assert_false(slot.matches(":has-slotted"),
                 "matches() reflects the removed child");
    assert_equals(host.shadowRoot.querySelectorAll(":has-slotted").length, 0,
                  "querySelectorAll() reflects the removed child");
  }, "The selector APIs reflect a removed child without a preceding flush");

  test(function () {
    const host = document.getElementById("host5");
    const slot = host.shadowRoot.querySelector("slot");
    host.querySelector("i").setAttribute("slot", "other");
    assert_false(slot.matches(":has-slotted"),
                 "matches() reflects the changed slot attribute");
  }, "The selector APIs reflect a changed slot attribute without a preceding flush");
</script>
