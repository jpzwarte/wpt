<!doctype html>
<meta charset="utf-8">
<title>Changing content targetting :has-slotted(...) through a single shadow root</title>
<link rel="help" href="https://github.com/w3c/csswg-drafts/pull/10586">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<!--
  The three slot rules below are mutually exclusive, so the expected colour does
  not depend on the relative specificity of :has-slotted and :has-slotted(),
  which the specification does not define yet. Black means no rule matched.
  No whitespace inside #test: a whitespace text node would be assigned to the slot.
-->
<div id="test"><template shadowrootmode="open"><slot></slot><p id="target">This text will be styled.</p><style>
  p { color: rgb(0, 0, 0); }
  slot:not(:has-slotted) + p { color: rgb(0, 0, 255); }
  slot:has-slotted(span) + p { color: rgb(255, 0, 255); }
  slot:has-slotted(div) + p { color: rgb(0, 255, 0); }
</style></template></div>
<script>
  const blue = 'rgb(0, 0, 255)';       // nothing is slotted
  const fuchsia = 'rgb(255, 0, 255)';  // a span is slotted
  const green = 'rgb(0, 255, 0)';      // a div is slotted

  test(function (t) {
    const host = document.getElementById('test');
    const target = host.shadowRoot.getElementById('target');
    const color = () => getComputedStyle(target).getPropertyValue('color');
    t.add_cleanup(() => { host.replaceChildren(); });

    assert_equals(color(), blue, 'nothing slotted');

    host.innerHTML = '<span></span>';
    assert_equals(color(), fuchsia, 'a span is slotted');

    host.textContent = '';
    assert_equals(color(), blue, 'emptied with textContent');

    host.append(document.createElement('span'));
    assert_equals(color(), fuchsia, 'a span is slotted again');

    host.replaceChild(document.createElement('div'), host.firstElementChild);
    assert_equals(color(), green, 'the span is replaced by a div');

    host.replaceChildren(document.createElement('span'));
    assert_equals(color(), fuchsia, 'the div is replaced by a span');

    host.replaceChildren();
    assert_equals(color(), blue, 'emptied with replaceChildren()');
  }, ':has-slotted(span) and :has-slotted(div) are invalidated as the light DOM changes');
</script>
